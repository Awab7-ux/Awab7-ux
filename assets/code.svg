<text x="32" y="98" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c0)"><tspan fill="#64748B"># Illustrative: every query is scoped to the caller's organization</tspan></text><text x="32" y="128" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c1)"><tspan fill="#C084FC">@jwt_required()</tspan></text><text x="32" y="158" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c2)"><tspan fill="#C084FC">def </tspan><tspan fill="#38BDF8">list_contracts</tspan><tspan fill="#E2E8F0">():</tspan></text><text x="32" y="188" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c3)"><tspan fill="#E2E8F0">    org_id = </tspan><tspan fill="#38BDF8">get_jwt</tspan><tspan fill="#E2E8F0">()[</tspan><tspan fill="#22C55E">"org_id"</tspan><tspan fill="#E2E8F0">]</tspan></text><text x="32" y="218" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c4)"><tspan fill="#E2E8F0">    rows = Contract.query.</tspan><tspan fill="#38BDF8">filter_by</tspan><tspan fill="#E2E8F0">(org_id=org_id)</tspan></text><text x="32" y="248" xml:space="preserve" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="18" clip-path="url(#c5)"><tspan fill="#C084FC">    return </tspan><tspan fill="#38BDF8">jsonify</tspan><tspan fill="#E2E8F0">([c.to_dict() </tspan><tspan fill="#C084FC">for </tspan><tspan fill="#E2E8F0">c </tspan><tspan fill="#C084FC">in </tspan><tspan fill="#E2E8F0">rows])</tspan></text>
