</g>
<circle cy="14" r="3" fill="#38BDF8"><animate attributeName="cx" values="0;1200" dur="7s" repeatCount="indefinite"/></circle>
<circle cy="14" r="3" fill="#C084FC"><animate attributeName="cx" values="1200;0" dur="9s" repeatCount="indefinite"/></circle>
