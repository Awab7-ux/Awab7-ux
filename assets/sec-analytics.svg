<rect x="0" y="0" width="7" height="100" fill="url(#bar)"><animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/></rect>
<text x="40" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1" fill="url(#tx)">GitHub Analytics</text>
<text x="42" y="82" font-family="'Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="14" letter-spacing="1" fill="#7DD3FC" opacity="0.85">// activity, languages and contributions</text>
