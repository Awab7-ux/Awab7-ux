<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="1200" height="100" role="img" aria-label="GitHub Analytics">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B1224"/><stop offset="1" stop-color="#020617"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#38BDF8"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#818CF8" stroke-opacity="0.07"/>
<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/></pattern>
<clipPath id="c"><rect width="1200" height="100" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="100" fill="url(#bg)"/><rect width="1200" height="100" fill="url(#gr)"/>
<circle cx="140" cy="40" r="120" fill="#818CF8" opacity="0.10"><animate attributeName="cx" values="120;260;120" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="70" r="140" fill="#38BDF8" opacity="0.10"><animate attributeName="cx" values="1080;940;1080" dur="11s" repeatCount="indefinite"/></circle>
